<!-- Topbar Fixa com Glassmorphism -->
<header
  class="fixed top-0 left-0 right-0 z-50 glass-md border-b border-white/5"
  [@topbarEnter]
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-4">
      <!-- Logo/Branding -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-md">
          <span class="text-sm font-bold text-white">LA</span>
        </div>
        <span class="text-lg font-bold text-white hidden sm:inline">LA Jobs AI</span>
      </div>

      <!-- Barra de Busca Centralizada -->
      <div class="flex-1 max-w-md mx-auto">
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg
              class="w-4 h-4 text-zinc-500 group-focus-within:text-blue-400 transition-colors"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </div>

          <input
            type="text"
            placeholder="Buscar vagas, empresas, tecnologias..."
            class="w-full pl-10 pr-4 py-2 bg-zinc-800/50 border border-zinc-700/50 rounded-lg text-sm text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            (input)="onSearchChange($event)"
            [@searchInputFocus]="searchFocused"
          />

          <!-- Sugestões de Busca (dropdown) -->
          <div
            *ngIf="searchFocused && searchSuggestions.length > 0"
            class="absolute top-full left-0 right-0 mt-2 bg-zinc-900 border border-zinc-700/50 rounded-lg shadow-lg overflow-hidden z-10"
            [@dropdownEnter]
          >
            <div class="max-h-64 overflow-y-auto scrollbar-thin">
              <button
                *ngFor="let suggestion of searchSuggestions"
                type="button"
                class="w-full px-4 py-2 text-left text-sm text-zinc-300 hover:bg-zinc-800/50 hover:text-white transition-colors flex items-center gap-2"
                (click)="selectSuggestion(suggestion)"
              >
                <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                {{ suggestion }}
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Ações Direita -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- Botão de Filtros (Mobile) -->
        <button
          class="p-2 rounded-lg hover:bg-zinc-800/50 transition-colors focus-ring text-zinc-400 hover:text-white lg:hidden"
          (click)="toggleFilters()"
          title="Abrir filtros"
          type="button"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
          </svg>
        </button>

        <!-- Botão de Notificações -->
        <button
          class="p-2 rounded-lg hover:bg-zinc-800/50 transition-colors focus-ring text-zinc-400 hover:text-white relative"
          title="Notificações"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
          <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>

        <!-- Menu de Usuário -->
        <div class="relative group">
          <button
            class="p-2 rounded-lg hover:bg-zinc-800/50 transition-colors focus-ring text-zinc-400 hover:text-white"
            (click)="toggleUserMenu()"
            title="Menu de usuário"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </button>

          <!-- Dropdown Menu de Usuário -->
          <div
            *ngIf="userMenuOpen"
            class="absolute right-0 mt-2 w-48 bg-zinc-900 border border-zinc-700/50 rounded-lg shadow-lg overflow-hidden z-10"
            [@dropdownEnter]
          >
            <div class="px-4 py-3 border-b border-zinc-700/50">
              <p class="text-sm font-medium text-white">Usuário</p>
              <p class="text-xs text-zinc-400">user&#64;example.com</p>
            </div>
            <button
              class="w-full px-4 py-2 text-left text-sm text-zinc-300 hover:bg-zinc-800/50 hover:text-white transition-colors"
            >
              Perfil
            </button>
            <button
              class="w-full px-4 py-2 text-left text-sm text-zinc-300 hover:bg-zinc-800/50 hover:text-white transition-colors"
            >
              Preferências
            </button>
            <div class="border-t border-zinc-700/50"></div>
            <button
              class="w-full px-4 py-2 text-left text-sm text-red-400 hover:bg-red-500/10 transition-colors"
            >
              Sair
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Indicador de Scroll (linha de progresso) -->
  <div
    class="absolute bottom-0 left-0 h-0.5 bg-gradient-to-r from-blue-500 to-purple-600 transition-all duration-300"
    [style.width.%]="scrollProgress"
  ></div>
</header>

<!-- Espaçador para compensar a posição fixa -->
<div class="h-16"></div>
