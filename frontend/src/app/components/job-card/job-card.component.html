<div
    class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 hover:border-blue-500 transition-all duration-300 shadow-lg"
>

    <div class="flex items-start justify-between">

        <div>

            <h2 class="text-xl font-bold text-white">
                {{ job.title }}
            </h2>

            <p class="text-zinc-400 mt-1">
                {{ job.company }}
            </p>

        </div>

        <div
            class="px-3 py-1 rounded-full text-xs font-semibold"
            [ngClass]="{
                'bg-green-500/20 text-green-400':
                    job.remote,

                'bg-red-500/20 text-red-400':
                    !job.remote
            }"
        >
            {{ job.remote ? 'Remoto' : 'Presencial' }}
        </div>

    </div>

    <div class="mt-4 flex flex-wrap gap-2">

        <span
            *ngFor="let tech of job.stack"
            class="bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full text-xs"
        >
            {{ tech }}
        </span>

    </div>

    <div class="mt-5">

        <div class="flex justify-between mb-2">

            <span class="text-zinc-400 text-sm">
                Match IA
            </span>

            <span class="text-white font-bold">
                {{ job.match_score }}%
            </span>

        </div>

        <div
            class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden"
        >
            <div
                class="h-full bg-blue-500"
                [style.width.%]="job.match_score"
            ></div>
        </div>

    </div>

    <div class="mt-5">

        <p class="text-zinc-300 text-sm leading-relaxed">
            {{ job.ai_summary }}
        </p>

    </div>

</div>
